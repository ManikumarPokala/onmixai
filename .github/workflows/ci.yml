name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/mypy src/ tests/

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/lint-imports

  test:
    # Integration tests use testcontainers (Docker is available on the runner),
    # which provisions the non-superuser runtime role and runs migrations exactly
    # as in local dev — so role separation and RLS are reproduced faithfully.
    runs-on: ubuntu-latest
    # create_app() reads config at construction; the real DB is the testcontainer
    # (injected via dependency override), so DATABASE_URL here is only a placeholder.
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://onmixai_app:onmixai_app@localhost:5432/onmixai
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: access
      STORAGE_SECRET_KEY: secret
      STORAGE_BUCKET: onmixai-test
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_DIMENSION: "8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      # Two passes: the async suite, then the parser tests isolated from the
      # pytest-asyncio plugin (PyMuPDF SWIG conflict). See ADR 0008.
      - run: ./scripts/run-tests.sh

  isolation:
    # Separate, permanently-blocking job. Runs as the non-bypassrls runtime role
    # (via testcontainers) — never a superuser, or it would prove nothing.
    runs-on: ubuntu-latest
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://onmixai_app:onmixai_app@localhost:5432/onmixai
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: access
      STORAGE_SECRET_KEY: secret
      STORAGE_BUCKET: onmixai-test
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_DIMENSION: "8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/pytest tests/isolation/ -q

  eval:
    # Retrieval golden-set regression gate (CLAUDE.md §11 #10). Runs the real hybrid
    # pipeline over the seeded corpus and gates recall@5 >= 0.85 (FTS-anchored, no
    # paid model — see tests/eval). Activated in Phase 2.
    runs-on: ubuntu-latest
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://onmixai_app:onmixai_app@localhost:5432/onmixai
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: access
      STORAGE_SECRET_KEY: secret
      STORAGE_BUCKET: onmixai-test
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_DIMENSION: "8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/pytest tests/eval -q -s -m "not generation"

  eval-generation:
    # Generation golden-set regression gate (Phase 3). Runs the real pipeline (prompt
    # registry -> guardrails -> gateway) against the in-process deterministic stub and
    # judges with eval_judge_faithfulness; gates faithfulness >= 0.9. No DB — guards
    # src/ai/** changes (prompts, guardrails, gateway). Honesty caveat: ADR 0013.
    runs-on: ubuntu-latest
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://onmixai_app:onmixai_app@localhost:5432/onmixai
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: access
      STORAGE_SECRET_KEY: secret
      STORAGE_BUCKET: onmixai-test
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_DIMENSION: "8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/pytest tests/eval -q -s -m generation

  migrations:
    # Reversibility on a clean DB. Migrations run as the owner role; this proves
    # upgrade -> downgrade -> upgrade is clean.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onmixai
          POSTGRES_PASSWORD: onmixai
          POSTGRES_DB: onmixai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onmixai -d onmixai"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://onmixai:onmixai@localhost:5432/onmixai
      DATABASE_URL: postgresql+asyncpg://onmixai:onmixai@localhost:5432/onmixai
      EMBEDDING_DIMENSION: "8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/alembic upgrade head
      - run: .venv/bin/alembic downgrade base
      - run: .venv/bin/alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: openapi-typescript's peer range trails TypeScript 6 (dev-only).
      - run: npm ci --legacy-peer-deps
      # The generated client must match the committed OpenAPI snapshot (a stale client fails).
      - run: npm run generate:api
      - run: git diff --exit-code src/lib/api/schema.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  openapi-sync:
    # The committed OpenAPI snapshot (frontend/openapi.json) must match the live FastAPI
    # schema — a backend API change without a regenerated snapshot fails here (and would
    # then fail the frontend client-regeneration check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/python -m scripts.dump_openapi
      - run: git -C .. diff --exit-code -- frontend/openapi.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan, full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - name: pip-audit (fail on high+)
        run: .venv/bin/pip-audit
      - name: npm audit (fail on high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  benchmarks:
    # Hot-path benchmark gate (CLAUDE.md §8 / performance.md §2), activated in Phase 2.
    # Bulk-loads a 100k-chunk corpus (testcontainers) and asserts hybrid /search p95 <
    # 3s. The realistic-dimension p95 + ef_search recall table are measured offline
    # (scripts/drills/ef_search_sweep.py) and recorded in ADR 0009.
    runs-on: ubuntu-latest
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://onmixai_app:onmixai_app@localhost:5432/onmixai
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: access
      STORAGE_SECRET_KEY: secret
      STORAGE_BUCKET: onmixai-test
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_DIMENSION: "8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/pytest -m benchmark tests/benchmarks -q -s
