# Isolated pytest config for the synchronous parser tests.
#
# These tests run in their own pytest process with third-party plugin autoload
# DISABLED (PYTEST_DISABLE_PLUGIN_AUTOLOAD=1), because PyMuPDF's SWIG runtime
# cannot be imported into a process where pytest-asyncio's event-loop plugin is
# active — it segfaults (EXC_BAD_ACCESS in _PyObject_New) on macOS/arm64. The
# parser tests are pure-synchronous and need no async plugin. See
# docs/adr/0008-parser-test-isolation.md and scripts/run-tests.sh.
[pytest]
addopts = -p no:cacheprovider
# PyMuPDF's SWIG types raise CPython DeprecationWarnings on import; they are
# upstream noise, not our concern, and would otherwise clutter this run.
filterwarnings =
    ignore::DeprecationWarning
