[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onmixai-backend"
version = "0.1.0"
description = "OnMixAI backend — enterprise AI decision intelligence platform"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "structlog==25.5.0",
    "pyjwt==2.13.0",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.30",
    "slowapi==0.1.9",
    "aioboto3==15.5.0",
    "arq==0.28.0",
    "redis==5.3.1",
    "pgvector==0.4.2",
    "pymupdf==1.27.2.3",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "charset-normalizer==3.4.7",
    "pytesseract==0.3.13",
    "openai==2.41.0",
    "litellm==1.88.0",
    "langfuse==4.7.1",
    "langgraph==1.0.10",  # fixed report-generation graph (Phase 5, ADR 0017); 1.0.x clears PYSEC-2026-83
    # Pinned explicitly (langgraph allows checkpoint <5.0,>=2.1, so it wouldn't upgrade the
    # transitive 2.1.2): 4.x clears CVE-2025-64439 (fix 3.0.0) + CVE-2026-27794 (fix 4.0.0).
    "langgraph-checkpoint==4.1.1",
    "fpdf2==2.8.5",  # deterministic, dependency-free PDF export (Phase 5, ADR 0018)
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.14.2",
    "psycopg[binary]==3.3.4",
    "ruff==0.15.15",
    "mypy==2.1.0",
    "import-linter==2.11",
    "pip-audit==2.10.0",
    "numpy==2.4.6",  # benchmark corpus generation (tests/benchmarks, ef_search sweep)
    "hypothesis==6.122.3",  # property tests (confidence-band monotonicity, Phase 5)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C901", "T201"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Operational drill/CLI scripts may print to stdout.
"scripts/**" = ["T201"]
# The retrieval eval + benchmark report metrics to stdout.
"tests/eval/**" = ["T201"]
"tests/benchmarks/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are used as argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.security.HTTPBearer",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
# These dependencies ship no (complete) type information.
module = [
    "testcontainers.*",
    "slowapi.*",
    "aioboto3.*",
    "aiobotocore.*",
    "botocore.*",
    "pgvector.*",
    "arq.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Parser + render libraries are partially/incompletely typed — treat as untyped (Any).
module = [
    "pymupdf.*",
    "fitz.*",
    "docx.*",
    "pptx.*",
    "pytesseract.*",
    "openpyxl.*",
    "litellm.*",
    "langfuse.*",
    "fpdf.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The PDF renderer subclasses fpdf2's FPDF (an Any base, since fpdf2 is untyped) to override
# footer() — the library's only extension point for a per-page footer.
module = ["src.reports.pdf"]
disallow_subclassing_any = false

[tool.importlinter]
root_package = "src"
# Required so the SDK-confinement contract can name an external package (openai).
include_external_packages = "true"

[[tool.importlinter.contracts]]
# Dependency stack (CLAUDE.md §3.3): main may import anything; knowledge may
# import identity (auth) + shared; identity may import shared; shared imports no
# domain. Reverse imports (e.g. identity -> knowledge) are forbidden.
name = "Layered architecture: main > governance > reports > recommendation > conversation > search > knowledge > identity > ai > shared"
type = "layers"
# governance (Phase 6) sits at the top below main: it reads the cross-cutting audit store
# (shared) and aggregates over the feature domains for analytics/retention — never the reverse.
# reports + recommendation (Phase 5 decision outputs) sit above conversation: they consume the
# retriever (search), the ai gateway/registry/guardrails, and conversation's grounding
# primitives — never the reverse. conversation (Phase 4 chat) sits above search; search above
# knowledge; ai below the feature domains and above shared. The linear stack forbids upward
# imports (reports never imports recommendation and vice versa — neither needs to).
layers = [
    "src.main",
    "src.governance",
    "src.reports",
    "src.recommendation",
    "src.conversation",
    "src.search",
    "src.knowledge",
    "src.identity",
    "src.ai",
    "src.shared",
]

[[tool.importlinter.contracts]]
# Cross-domain access is via the other domain's interface (service/dependencies/
# schemas), never its repository or models (CLAUDE.md §3.3).
name = "knowledge uses identity's interface, not its internals"
type = "forbidden"
source_modules = ["src.knowledge"]
forbidden_modules = ["src.identity.repository", "src.identity.models"]
# Only DIRECT imports are forbidden: knowledge may import identity's interface
# (dependencies/schemas), which legitimately uses identity's repository internally.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
# search reaches knowledge only through its interface (service/schemas/the
# candidate-reader port it owns), never knowledge's repository or models.
name = "search uses knowledge's interface, not its internals"
type = "forbidden"
source_modules = ["src.search"]
forbidden_modules = ["src.knowledge.repository", "src.knowledge.models"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
# Provider SDKs are confined to ai/adapters/ (CLAUDE.md §3.6): every other module
# depends on a Protocol (Embedder / LLMGateway), never a vendor SDK. openai serves
# the embedder adapter; litellm serves the LLM gateway adapter (Task 4). Both are
# importable only from ai/adapters/.
name = "Provider SDKs (openai, litellm, langfuse) only imported by ai adapters"
type = "forbidden"
source_modules = [
    "src.main",
    "src.governance",
    "src.reports",
    "src.recommendation",
    "src.conversation",
    "src.search",
    "src.knowledge",
    "src.identity",
    "src.ai.embedding",
    "src.ai.gateway",
    "src.ai.dependencies",
    "src.ai.tracing",
    "src.ai.metering",
    "src.shared",
]
forbidden_modules = ["openai", "litellm", "langfuse"]
# Only DIRECT imports are forbidden: the adapters under ai/adapters/ are the sole SDK
# sites. Other modules may reach them transitively (e.g. main → ai.dependencies → the
# adapter) without importing the vendor SDK themselves.
allow_indirect_imports = "true"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
]
markers = [
    "benchmark: hot-path performance benchmark — runs in the benchmarks CI job, not the default suite",
    "generation: generation golden-set eval — runs in the eval-generation job (make eval-generation), not the retrieval eval",
    "chat: chat golden-set eval — full rewrite→retrieve→pipeline path vs stub (make eval-chat); not in the default suite",
    "recommendation: recommendation golden-set eval — pipeline vs deterministic fakes (make eval-recommendation); not in the default suite",
    "report: report golden-set eval — fixed knowledge→report graph vs deterministic fakes (make eval-report); not in the default suite",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
