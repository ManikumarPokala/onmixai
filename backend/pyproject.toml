[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onmixai-backend"
version = "0.1.0"
description = "OnMixAI backend — enterprise AI decision intelligence platform"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "structlog==25.5.0",
    "pyjwt==2.13.0",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.30",
    "slowapi==0.1.9",
    "aioboto3==15.5.0",
    "arq==0.28.0",
    "redis==5.3.1",
    "pgvector==0.4.2",
    "pymupdf==1.27.2.3",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "charset-normalizer==3.4.7",
    "pytesseract==0.3.13",
    "openai==2.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.14.2",
    "psycopg[binary]==3.3.4",
    "ruff==0.15.15",
    "mypy==2.1.0",
    "import-linter==2.11",
    "pip-audit==2.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C901", "T201"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Operational drill/CLI scripts may print to stdout.
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are used as argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.security.HTTPBearer",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
# These dependencies ship no (complete) type information.
module = [
    "testcontainers.*",
    "slowapi.*",
    "aioboto3.*",
    "aiobotocore.*",
    "botocore.*",
    "pgvector.*",
    "arq.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Parser libraries are partially/incompletely typed — treat as untyped (Any).
module = ["pymupdf.*", "fitz.*", "docx.*", "pptx.*", "pytesseract.*", "openpyxl.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.importlinter]
root_package = "src"
# Required so the SDK-confinement contract can name an external package (openai).
include_external_packages = "true"

[[tool.importlinter.contracts]]
# Dependency stack (CLAUDE.md §3.3): main may import anything; knowledge may
# import identity (auth) + shared; identity may import shared; shared imports no
# domain. Reverse imports (e.g. identity -> knowledge) are forbidden.
name = "Layered architecture: main > knowledge > identity > ai > shared"
type = "layers"
# knowledge depends on the ai domain only through its Embedder Protocol; ai sits
# below the feature domains and above shared. identity and ai never import each
# other (the linear stack merely forbids upward imports).
layers = ["src.main", "src.knowledge", "src.identity", "src.ai", "src.shared"]

[[tool.importlinter.contracts]]
# Cross-domain access is via the other domain's interface (service/dependencies/
# schemas), never its repository or models (CLAUDE.md §3.3).
name = "knowledge uses identity's interface, not its internals"
type = "forbidden"
source_modules = ["src.knowledge"]
forbidden_modules = ["src.identity.repository", "src.identity.models"]
# Only DIRECT imports are forbidden: knowledge may import identity's interface
# (dependencies/schemas), which legitimately uses identity's repository internally.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
# The embedding provider SDK is confined to ai/adapters/ (CLAUDE.md §3.6): every
# other module depends on the Embedder Protocol, never the vendor SDK.
name = "OpenAI SDK only imported by ai adapters"
type = "forbidden"
source_modules = [
    "src.main",
    "src.knowledge",
    "src.identity",
    "src.ai.embedding",
    "src.shared",
]
forbidden_modules = ["openai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
