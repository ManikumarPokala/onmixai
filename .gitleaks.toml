# gitleaks configuration — extends the default ruleset and allowlists the two
# clearly-fake, documented placeholder secrets used in tests and local dev. These
# are never real credentials (the dev value is also in DENYLISTED_SECRETS so it
# cannot be used when ENV=prod). Everything else is still scanned.
[extend]
useDefault = true

[allowlist]
description = "Known non-secret placeholders (test fixtures + documented dev defaults)"
regexes = [
  '''test-secret-key-at-least-32-characters-long''',
  '''dev-only-insecure-secret-change-me-32\+chars''',
]
# Scoped to one historical commit only. 55f786b carried a pre-reshape line in
# tests/shared/test_config.py where the generic-api-key rule greedily captured a kwarg tail
# (`ingest_chaos_delay_seconds=5.0`) off a dense fixture line. The fixture builds Settings from
# constructed fakes only — no credential. The current tree was reshaped so live code is clean;
# this allowlists ONLY that one past commit (not the path, not the rule).
commits = [
  "55f786b2a5e045f9e96950fe4d6d43a4f325b81c",
]
