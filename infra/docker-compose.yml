# Local development stack: Postgres + the OnMixAI API.
# Secrets use clearly-marked dev defaults via ${VAR:-default} substitution so the
# stack boots out of the box; real deployments inject real values from the
# environment. No production secret is ever committed here.
services:
  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + the pgvector extension (digest-pinned).
    image: pgvector/pgvector@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onmixai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onmixai}
      POSTGRES_DB: ${POSTGRES_DB:-onmixai}
    # Host port defaults to 5440 to avoid colliding with a native Postgres on
    # 5432; the container-internal port stays 5432 (the api service connects via
    # the compose network at postgres:5432). Override with POSTGRES_HOST_PORT.
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onmixai} -d ${POSTGRES_DB:-onmixai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible object storage for local dev. Pinned by digest (RELEASE.2025-09-07).
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-onmixai}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-onmixai-dev-secret-key}
    # Host ports default to 9110/9111 to avoid colliding with other local MinIO
    # instances (9000/9001 and 9100/9101 are commonly taken); container ports
    # are unchanged. Override with MINIO_API_HOST_PORT / MINIO_CONSOLE_HOST_PORT.
    ports:
      - "${MINIO_API_HOST_PORT:-9110}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9111}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "${REDIS_HOST_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-dev}
      # The API connects as the non-superuser runtime role so RLS is enforced.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://onmixai_app:onmixai_app@postgres:5432/onmixai}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32+chars}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # In-network endpoints (container ports), independent of host port mapping.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT_INTERNAL:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-onmixai}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-onmixai-dev-secret-key}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-onmixai}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379/0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    # Host port defaults to 8008 (8000 is commonly occupied); container stays 8000.
    ports:
      - "${API_HOST_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
