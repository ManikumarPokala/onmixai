# Local development stack: Postgres + the OnMixAI API.
# Secrets use clearly-marked dev defaults via ${VAR:-default} substitution so the
# stack boots out of the box; real deployments inject real values from the
# environment. No production secret is ever committed here.
services:
  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + the pgvector extension (digest-pinned).
    image: pgvector/pgvector@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    # Parallel HNSW index builds use dynamic shared memory; the 64 MB default
    # /dev/shm is too small at 1536-dim and aborts with a DiskFullError. 1 GB is
    # ample for the dev/benchmark corpora.
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onmixai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onmixai}
      POSTGRES_DB: ${POSTGRES_DB:-onmixai}
    # Host port defaults to 5440 to avoid colliding with a native Postgres on
    # 5432; the container-internal port stays 5432 (the api service connects via
    # the compose network at postgres:5432). Override with POSTGRES_HOST_PORT.
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onmixai} -d ${POSTGRES_DB:-onmixai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible object storage for local dev. Pinned by digest (RELEASE.2025-09-07).
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-onmixai}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-onmixai-dev-secret-key}
    # Host ports default to 9110/9111 to avoid colliding with other local MinIO
    # instances (9000/9001 and 9100/9101 are commonly taken); container ports
    # are unchanged. Override with MINIO_API_HOST_PORT / MINIO_CONSOLE_HOST_PORT.
    ports:
      - "${MINIO_API_HOST_PORT:-9110}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9111}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "${REDIS_HOST_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment: &app_environment
      ENV: ${ENV:-dev}
      # The API/worker connect as the non-superuser runtime role so RLS is enforced.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://onmixai_app:onmixai_app@postgres:5432/onmixai}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32+chars}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # In-network endpoints (container ports), independent of host port mapping.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT_INTERNAL:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-onmixai}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-onmixai-dev-secret-key}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-onmixai}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379/0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      INGEST_CHAOS_DELAY_SECONDS: ${INGEST_CHAOS_DELAY_SECONDS:-0}
      INGEST_STUCK_AFTER_SECONDS: ${INGEST_STUCK_AFTER_SECONDS:-1800}
      # LLM gateway (Phase 3). Defaults target the dev-only llm-stub (deterministic,
      # no account); point at a real OpenAI-compatible endpoint to use a real model.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-stub:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dev-stub-no-auth}
      # Embeddings configuration. Point at a real OpenAI-compatible endpoint by exporting
      # EMBEDDING_BASE_URL/EMBEDDING_API_KEY.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embeddings-stub:8000/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-dev-stub-no-auth}
    # Host port defaults to 8008 (8000 is commonly occupied); container stays 8000.
    ports:
      - "${API_HOST_PORT:-8008}:8000"
    depends_on: &app_depends
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
      embeddings-stub:
        condition: service_healthy

  worker:
    # Same image as the API, run as the ARQ ingestion worker (+ sweeper cron).
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["arq", "src.worker.WorkerSettings"]
    environment:
      <<: *app_environment
    depends_on:
      <<: *app_depends

  embeddings-stub:
    # DEV ONLY. OpenAI-compatible embeddings endpoint returning deterministic
    # vectors of EMBEDDING_DIMENSION, so the real OpenAIEmbedder can run end-to-end
    # with no external account. Never used outside local dev.
    image: python:3.12-slim
    command: ["python", "/app/embeddings_stub.py"]
    environment:
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    volumes:
      - ./dev/embeddings_stub.py:/app/embeddings_stub.py:ro
    ports:
      - "${EMBEDDINGS_STUB_HOST_PORT:-9120}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  llm-stub:
    # DEV ONLY. OpenAI-compatible chat-completions endpoint returning deterministic
    # echo-derived completions (with header-driven fault injection for resilience
    # drills), so the gateway + adapter run end-to-end with no external account.
    # Never used outside local dev.
    image: python:3.12-slim
    command: ["python", "/app/llm_stub.py"]
    volumes:
      - ./dev/llm_stub.py:/app/llm_stub.py:ro
    ports:
      - "${LLM_STUB_HOST_PORT:-9130}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  miniodata:
